[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "dmgr"
version = "1.0.0"
description = "Device Manager CLI for Arch Linux"
requires-python = ">=3.10"
dependencies = [
    "dasbus >= 1.7",
    "rich >= 13.0",
]

[project.scripts]
dmgr = "dmgr.__main__:main"

[tool.setuptools.packages.find]
include = ["dmgr*"]
